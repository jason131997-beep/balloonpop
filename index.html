<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balloon Pop">
<meta name="theme-color" content="#7cc6f2">
<title>Balloon Pop</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#7cc6f2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .3s}
#hud.on{opacity:1}
.score{font-size:42px;font-weight:900;text-shadow:0 3px 0 rgba(30,80,140,.35);line-height:1}
.best{font-size:14px;font-weight:700;opacity:.9;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.lives{font-size:26px;letter-spacing:2px;text-align:right}
.combo{font-size:16px;font-weight:800;color:#fff6a8;text-align:right;margin-top:4px;min-height:20px;text-shadow:0 2px 0 rgba(200,80,0,.3)}
.ctl{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;z-index:5}
.ic{width:52px;height:52px;border-radius:26px;border:0;background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:24px;box-shadow:0 3px 0 rgba(30,80,140,.25);padding:0}
.ic.off{opacity:.45}
#pauseBtn{display:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 70px);background:rgba(40,110,180,.16);transition:opacity .35s,transform .35s;z-index:4}
.screen.hide{opacity:0;pointer-events:none;transform:scale(1.04)}
h1{margin:0 0 4px;font-size:62px;font-weight:900;line-height:.95;text-align:center;text-shadow:0 5px 0 #e2507a,0 9px 18px rgba(0,0,0,.18);letter-spacing:-1px}
h1 span{display:block;color:#fff3a0}
h2{margin:0;font-size:40px;font-weight:900;text-shadow:0 4px 0 #e2507a;text-align:center}
.sub{font-size:17px;font-weight:600;text-align:center;max-width:310px;line-height:1.4;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.big{font-size:76px;font-weight:900;line-height:1;text-shadow:0 5px 0 rgba(30,80,140,.35)}
.pill{border:0;border-radius:999px;padding:18px 40px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#ff7aa2,#e2507a);box-shadow:0 6px 0 #a8305a,0 12px 20px rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s;font-family:inherit;min-width:240px}
.pill:active{transform:translateY(5px);box-shadow:0 1px 0 #a8305a}
.pill.alt{background:linear-gradient(#7fe0c0,#3fb894);box-shadow:0 6px 0 #23805f,0 12px 20px rgba(0,0,0,.2)}
.pill.alt:active{box-shadow:0 1px 0 #23805f}
.pill.ghost{background:rgba(255,255,255,.3);box-shadow:0 5px 0 rgba(30,80,140,.3);font-size:19px;padding:14px 30px}
.toggle{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.28);border-radius:20px;padding:12px 18px;font-weight:800;font-size:16px;min-width:240px;justify-content:space-between;box-shadow:0 3px 0 rgba(30,80,140,.2)}
.sw{width:56px;height:32px;border-radius:16px;background:rgba(0,0,0,.2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.toggle.on .sw{background:#3fb894}.toggle.on .sw::after{transform:translateX(24px)}
.newbest{color:#fff3a0;font-weight:900;font-size:20px;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div><div class="score" id="score">0</div><div class="best" id="bestHud">Best 0</div></div>
<div><div class="lives" id="lives"></div><div class="combo" id="combo"></div></div></div>
<div class="ctl"><button class="ic" id="pauseBtn" aria-label="Pause">⏸️</button><button class="ic" id="musicBtn" aria-label="Music">🎵</button><button class="ic" id="sfxBtn" aria-label="Sounds">🔊</button></div>

<div class="screen" id="title">
  <h1>Balloon<span>Pop!</span></h1>
  <div class="sub">Tap the balloons before they float away! Golden ones are worth extra. ⭐</div>
  <button class="pill" id="playBtn">Play</button>
  <button class="pill alt" id="zenBtn">Zen Mode 🌈</button>
  <div class="toggle" id="spikyTog"><span>Spiky balloons 🦔</span><span class="sw"></span></div>
  <div class="best" id="bestTitle"></div>
</div>
<div class="screen hide" id="paused"><h2>Paused</h2><button class="pill" id="resumeBtn">Keep Playing</button><button class="pill ghost" id="quitBtn">Menu</button></div>
<div class="screen hide" id="over">
  <h2 id="overTitle">Great job! 🎉</h2>
  <div class="big" id="finalScore">0</div>
  <div id="newBest" class="newbest" style="display:none">New best! ⭐</div>
  <div class="sub" id="overStats"></div>
  <button class="pill" id="againBtn">Play Again</button>
  <button class="pill ghost" id="menuBtn">Menu</button>
</div>
<script src="haptics.js"></script>
<script src="game.js"></script>
</body></html>
